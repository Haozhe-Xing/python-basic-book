<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="420" fill="#f8f9fc"/>

  <!-- 标题 -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">班级成绩柱状图（高度 = 分数）</text>

  <!-- 网格线 + 刻度 -->
  <line x1="80" y1="360" x2="760" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="310" x2="760" y2="310" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="260" x2="760" y2="260" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="210" x2="760" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="160" x2="760" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="364" text-anchor="end" font-size="12" fill="#64748b">0</text>
  <text x="70" y="314" text-anchor="end" font-size="12" fill="#64748b">25</text>
  <text x="70" y="264" text-anchor="end" font-size="12" fill="#64748b">50</text>
  <text x="70" y="214" text-anchor="end" font-size="12" fill="#64748b">75</text>
  <text x="70" y="164" text-anchor="end" font-size="12" fill="#64748b">100</text>

  <!-- 柱子：小丽(绿,最高) / 其余蓝，高度 = 分数*2 -->
  <!-- 小丽 96 -> 192, top 168 -->
  <rect x="106" y="168" width="60" height="192" rx="6" fill="#10b981"/>
  <text x="136" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">96</text>
  <text x="136" y="380" text-anchor="middle" font-size="13" fill="#1e293b">小丽</text>

  <!-- 小明 92 -> 184, top 176 -->
  <rect x="220" y="176" width="60" height="184" rx="6" fill="#4A6CF7"/>
  <text x="250" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">92</text>
  <text x="250" y="380" text-anchor="middle" font-size="13" fill="#1e293b">小明</text>

  <!-- 小芳 88 -> 176, top 184 -->
  <rect x="333" y="184" width="60" height="176" rx="6" fill="#4A6CF7"/>
  <text x="363" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">88</text>
  <text x="363" y="380" text-anchor="middle" font-size="13" fill="#1e293b">小芳</text>

  <!-- 小刚 85 -> 170, top 190 -->
  <rect x="446" y="190" width="60" height="170" rx="6" fill="#4A6CF7"/>
  <text x="476" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">85</text>
  <text x="476" y="380" text-anchor="middle" font-size="13" fill="#1e293b">小刚</text>

  <!-- 小红 78 -> 156, top 204 -->
  <rect x="560" y="204" width="60" height="156" rx="6" fill="#4A6CF7"/>
  <text x="590" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">78</text>
  <text x="590" y="380" text-anchor="middle" font-size="13" fill="#1e293b">小红</text>

  <!-- 小强 64 -> 128, top 232 -->
  <rect x="673" y="232" width="60" height="128" rx="6" fill="#4A6CF7"/>
  <text x="703" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">64</text>
  <text x="703" y="380" text-anchor="middle" font-size="13" fill="#1e293b">小强</text>

  <!-- 平均线 -->
  <line x1="80" y1="192.34" x2="760" y2="192.34" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="755" y="186" text-anchor="end" font-size="12" fill="#d97706">平均分 ≈ 83.8</text>
</svg>
