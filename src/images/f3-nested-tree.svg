<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="460" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">嵌套结构树：列表里装着字典，字典里装着列表</text>

  <!-- 根：列表 -->
  <rect x="280" y="56" width="240" height="48" rx="8" fill="#4A6CF7"/>
  <text x="400" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">visitors = [ ... ]  (list)</text>
  <line x1="380" y1="104" x2="340" y2="138" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="104" x2="460" y2="138" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 游客 1 -->
  <rect x="230" y="146" width="220" height="40" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="340" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">{ name: "小明", ... }</text>
  <!-- 游客 2 -->
  <rect x="450" y="146" width="220" height="40" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="560" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">{ name: "小红", ... }</text>

  <!-- 游客 1 字段 -->
  <line x1="320" y1="186" x2="300" y2="214" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="186" x2="400" y2="214" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="220" width="180" height="40" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="290" y="245" text-anchor="middle" font-size="13" fill="#1e293b">name: "小明"</text>
  <rect x="420" y="220" width="210" height="40" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="525" y="245" text-anchor="middle" font-size="13" fill="#1e293b">played: [ ... ] (list)</text>

  <!-- played 列表展开 -->
  <line x1="525" y1="260" x2="525" y2="296" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="300" width="90" height="34" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="475" y="322" text-anchor="middle" font-size="12" fill="#1e293b">"过山车"</text>
  <rect x="530" y="300" width="90" height="34" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="575" y="322" text-anchor="middle" font-size="12" fill="#1e293b">"摩天轮"</text>

  <!-- 底部说明 -->
  <rect x="0" y="440" width="800" height="20" fill="#1e293b"/>
  <text x="400" y="454" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Courier New, monospace">容器套容器：list[ dict{ name, played: list } ]，现实世界就是一层层套起来的</text>
</svg>
