<svg xmlns="http://www.w3.org/2000/svg" width="680" height="784" viewBox="0 0 680 784" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svga-recursion-unfold-title svga-recursion-unfold-desc">
  <title id="svga-recursion-unfold-title">factorial 四的递归调用展开与返回</title>
  <desc id="svga-recursion-unfold-desc">展示 factorial(4) 如何展开为更小的调用直到 factorial(1)，再将结果逐层返回为 2、6、24。</desc>
  <rect x="0" y="0" width="680" height="784" fill="#F8FAFC"/>
  <text x="40" y="54" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1E293B">递归：factorial(4) 先深入，再返回</text>
  <text x="40" y="82" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" fill="#475569">规则：n == 1 时返回 1；否则返回 n × factorial(n - 1)。</text>

  <rect x="40" y="112" width="600" height="55" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="68" y="147" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="19" font-weight="700" fill="#1E3A8A">factorial(4) = 4 × factorial(3)</text>
  <path d="M340 180 L340 202" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 195 L340 203 L348 195" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="216" width="536" height="55" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="100" y="251" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="19" font-weight="700" fill="#1E3A8A">factorial(3) = 3 × factorial(2)</text>
  <path d="M340 284 L340 306" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 299 L340 307 L348 299" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="104" y="320" width="472" height="55" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="132" y="355" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="19" font-weight="700" fill="#1E3A8A">factorial(2) = 2 × factorial(1)</text>
  <path d="M340 388 L340 410" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 403 L340 411 L348 403" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="136" y="424" width="408" height="62" rx="14" fill="#FFF8E1" stroke="#F59E0B" stroke-width="2"/>
  <text x="340" y="452" text-anchor="middle" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="18" font-weight="700" fill="#92400E">factorial(1) = 1</text>
  <text x="340" y="474" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#92400E">基线条件：到这里不再调用自己。</text>

  <path d="M340 500 L340 522" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 515 L340 523 L348 515" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="104" y="536" width="472" height="50" rx="14" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>
  <text x="340" y="568" text-anchor="middle" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="18" font-weight="700" fill="#166534">factorial(2) = 2 × 1 = 2</text>
  <path d="M340 598 L340 620" stroke="#16A34A" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 613 L340 621 L348 613" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="72" y="634" width="536" height="50" rx="14" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>
  <text x="340" y="666" text-anchor="middle" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="18" font-weight="700" fill="#166534">factorial(3) = 3 × 2 = 6</text>
  <rect x="40" y="704" width="600" height="48" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="340" y="735" text-anchor="middle" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="19" font-weight="700" fill="#166534">factorial(4) = 4 × 6 = 24</text>
</svg>