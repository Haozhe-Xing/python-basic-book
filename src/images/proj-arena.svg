<svg width="800" height="440" viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="440" fill="#f8f9fc"/>

  <!-- 标题 -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">算法挑战擂台 · 解题流程图</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
  </defs>

  <!-- 三道题卡片 -->
  <rect x="60" y="70" width="200" height="70" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="160" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">P1 二分查找</text>
  <text x="160" y="120" text-anchor="middle" font-size="12" fill="#64748b">有序数组找目标 O(log n)</text>

  <rect x="300" y="70" width="200" height="70" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">P2 去重排序</text>
  <text x="400" y="120" text-anchor="middle" font-size="12" fill="#64748b">set + sorted O(n log n)</text>

  <rect x="540" y="70" width="200" height="70" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/>
  <text x="640" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">P3 爬楼梯</text>
  <text x="640" y="120" text-anchor="middle" font-size="12" fill="#64748b">递归/DP O(n)</text>

  <!-- 汇聚箭头：三题 → 流程起点 -->
  <line x1="160" y1="140" x2="118" y2="248" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="400" y1="140" x2="122" y2="250" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="640" y1="140" x2="126" y2="252" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- 流程四步 -->
  <rect x="40" y="250" width="150" height="70" rx="8" fill="#4A6CF7"/>
  <text x="115" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">① 读题</text>
  <text x="115" y="298" text-anchor="middle" font-size="12" fill="#eaf0ff">看清输入/输出</text>

  <rect x="215" y="250" width="150" height="70" rx="8" fill="#4A6CF7"/>
  <text x="290" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">② 想思路</text>
  <text x="290" y="298" text-anchor="middle" font-size="12" fill="#eaf0ff">套什么套路</text>

  <rect x="390" y="250" width="150" height="70" rx="8" fill="#4A6CF7"/>
  <text x="465" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">③ 写解</text>
  <text x="465" y="298" text-anchor="middle" font-size="12" fill="#eaf0ff">先写对的</text>

  <rect x="565" y="250" width="150" height="70" rx="8" fill="#10b981"/>
  <text x="640" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">④ 算复杂度</text>
  <text x="640" y="298" text-anchor="middle" font-size="12" fill="#dcfce7">再想快的</text>

  <!-- 步骤间箭头 -->
  <line x1="190" y1="285" x2="213" y2="285" stroke="#4A6CF7" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="365" y1="285" x2="388" y2="285" stroke="#4A6CF7" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="540" y1="285" x2="563" y2="285" stroke="#4A6CF7" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 底部说明 -->
  <text x="400" y="360" text-anchor="middle" font-size="13" fill="#64748b">三道题共用同一条流水线：读懂 → 选型 → 写对 → 优化复杂度</text>
  <text x="400" y="384" text-anchor="middle" font-size="12" fill="#94a3b8">USACO Bronze 的评分 = 正确性 + 在时限内跑完（复杂度合格）</text>
</svg>
