<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="460" fill="#f8f9fc"/>

  <!-- 标题 -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">冒泡排序 · 一趟（pass）做了什么</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#64748b">数组 [5, 3, 8, 1, 9, 2]：相邻两两比较，大的往后冒</text>

  <!-- ===== Frame A: 开始，比较 5 和 3 ===== -->
  <text x="124" y="92" font-size="14" font-weight="bold" fill="#f59e0b">第 1 步：比较 5 和 3</text>
  <g font-size="15" fill="#1e293b" text-anchor="middle" font-family="Arial">
    <rect x="124" y="100" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="164" y="130">5</text>
    <rect x="216" y="100" width="80" height="48" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/><text x="256" y="130">3</text>
    <rect x="308" y="100" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="348" y="130">8</text>
    <rect x="400" y="100" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="440" y="130">1</text>
    <rect x="492" y="100" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="532" y="130">9</text>
    <rect x="584" y="100" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="624" y="130">2</text>
  </g>
  <!-- 比较箭头 5 vs 3 -->
  <line x1="164" y1="82" x2="256" y2="82" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="156,82 164,77 164,87" fill="#f59e0b"/>
  <polygon points="264,82 256,77 256,87" fill="#f59e0b"/>
  <text x="210" y="72" text-anchor="middle" font-size="12" fill="#f59e0b">5 &gt; 3 → 交换</text>

  <!-- ===== Frame B: 比较 8 和 1 ===== -->
  <text x="124" y="212" font-size="14" font-weight="bold" fill="#f59e0b">第 2 步：比较 8 和 1</text>
  <g font-size="15" fill="#1e293b" text-anchor="middle" font-family="Arial">
    <rect x="124" y="220" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="164" y="250">3</text>
    <rect x="216" y="220" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="256" y="250">5</text>
    <rect x="308" y="220" width="80" height="48" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/><text x="348" y="250">8</text>
    <rect x="400" y="220" width="80" height="48" rx="8" fill="#fef9ec" stroke="#f59e0b" stroke-width="2"/><text x="440" y="250">1</text>
    <rect x="492" y="220" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="532" y="250">9</text>
    <rect x="584" y="220" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="624" y="250">2</text>
  </g>
  <!-- 比较箭头 8 vs 1 -->
  <line x1="348" y1="202" x2="440" y2="202" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="340,202 348,197 348,207" fill="#f59e0b"/>
  <polygon points="448,202 440,197 440,207" fill="#f59e0b"/>
  <text x="394" y="192" text-anchor="middle" font-size="12" fill="#f59e0b">8 &gt; 1 → 交换</text>

  <!-- ===== Frame C: 一趟结束，9 归位 ===== -->
  <text x="124" y="332" font-size="14" font-weight="bold" fill="#10b981">一趟结束：最大的 9 冒到了最后</text>
  <g font-size="15" fill="#1e293b" text-anchor="middle" font-family="Arial">
    <rect x="124" y="340" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="164" y="370">3</text>
    <rect x="216" y="340" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="256" y="370">5</text>
    <rect x="308" y="340" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="348" y="370">1</text>
    <rect x="400" y="340" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="440" y="370">8</text>
    <rect x="492" y="340" width="80" height="48" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="532" y="370">2</text>
    <rect x="584" y="340" width="80" height="48" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="3"/><text x="624" y="370" font-weight="bold" fill="#10b981">9</text>
  </g>
  <polygon points="620,326 628,326 624,334" fill="#10b981"/>
  <text x="624" y="318" text-anchor="middle" font-size="12" fill="#10b981">已归位</text>
  <text x="400" y="418" text-anchor="middle" font-size="13" fill="#64748b">一趟只把"最大的那个"送到末尾；下一趟它不参与，再冒出第二大……共 n−1 趟排完</text>

  <!-- 底部说明 -->
  <rect x="0" y="436" width="800" height="24" fill="#1e293b"/>
  <text x="400" y="452" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="Courier New, monospace">冒泡排序：每趟让一个最大元素"浮"到末尾，像气泡上浮 —— O(n²)</text>
</svg>
