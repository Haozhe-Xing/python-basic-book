<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">列表索引：从 0 开始数</text>

  <!-- 代码请求框 -->
  <rect x="60" y="60" width="200" height="44" rx="8" fill="#0f172a"/>
  <text x="160" y="88" text-anchor="middle" font-size="15" fill="#7dd3fc" font-family="Courier New, monospace">scores[0]</text>

  <!-- 单元格 -->
  <rect x="60"  y="145" width="150" height="70" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <rect x="230" y="145" width="150" height="70" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <rect x="400" y="145" width="150" height="70" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <rect x="570" y="145" width="150" height="70" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>

  <text x="135" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">小明</text>
  <text x="305" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">小红</text>
  <text x="475" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">小刚</text>
  <text x="645" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">小美</text>

  <!-- 正向索引 -->
  <text x="60" y="132" font-size="13" fill="#64748b">正向索引（从 0 开始）</text>
  <text x="135" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A6CF7">0</text>
  <text x="305" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A6CF7">1</text>
  <text x="475" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A6CF7">2</text>
  <text x="645" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#4A6CF7">3</text>

  <!-- 负向索引 -->
  <text x="60" y="262" font-size="13" fill="#64748b">负向索引（从 -1 往前数）</text>
  <text x="135" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#10b981">-4</text>
  <text x="305" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#10b981">-3</text>
  <text x="475" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#10b981">-2</text>
  <text x="645" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#10b981">-1</text>

  <!-- 箭头：scores[0] -> 小明 -->
  <line x1="160" y1="104" x2="135" y2="143" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="0" y="400" width="800" height="20" fill="#1e293b"/>
  <text x="400" y="414" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Courier New, monospace">第 1 个是 scores[0]，不是 scores[1] —— 计算机从 0 开始数！</text>
</svg>
