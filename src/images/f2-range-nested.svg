<svg width="800" height="460" viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="rn" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="460" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">range 与嵌套循环</text>

  <!-- 左：range -->
  <rect x="30" y="60" width="340" height="350" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="200" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">range：生成一串数</text>
  <text x="200" y="120" text-anchor="middle" font-size="13" fill="#64748b">range(start, stop, step)</text>

  <rect x="60" y="140" width="80" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="100" y="162" text-anchor="middle" font-size="13" fill="#1e293b">start=0</text>
  <rect x="160" y="140" width="80" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="200" y="162" text-anchor="middle" font-size="13" fill="#1e293b">stop=10</text>
  <rect x="260" y="140" width="80" height="34" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <text x="300" y="162" text-anchor="middle" font-size="13" fill="#1e293b">step=2</text>

  <line x1="200" y1="174" x2="200" y2="206" stroke="#4A6CF7" stroke-width="2" marker-end="url(#rn)"/>

  <circle cx="80" cy="250" r="20" fill="#4A6CF7"/>
  <text x="80" y="255" text-anchor="middle" font-size="13" fill="#fff">0</text>
  <circle cx="160" cy="250" r="20" fill="#4A6CF7"/>
  <text x="160" y="255" text-anchor="middle" font-size="13" fill="#fff">2</text>
  <circle cx="240" cy="250" r="20" fill="#4A6CF7"/>
  <text x="240" y="255" text-anchor="middle" font-size="13" fill="#fff">4</text>
  <circle cx="320" cy="250" r="20" fill="#4A6CF7"/>
  <text x="320" y="255" text-anchor="middle" font-size="13" fill="#fff">6</text>
  <circle cx="200" cy="320" r="20" fill="#4A6CF7"/>
  <text x="200" y="325" text-anchor="middle" font-size="13" fill="#fff">8</text>
  <text x="200" y="380" text-anchor="middle" font-size="13" fill="#64748b">→ 0, 2, 4, 6, 8（不含 10）</text>

  <!-- 箭头连接 -->
  <line x1="370" y1="235" x2="428" y2="235" stroke="#4A6CF7" stroke-width="2" marker-end="url(#rn)"/>

  <!-- 右：嵌套循环网格 -->
  <rect x="430" y="60" width="340" height="350" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">嵌套循环：网格</text>
  <text x="600" y="116" text-anchor="middle" font-size="13" fill="#64748b">外层管行，内层管列</text>

  <!-- 5 列 x 4 行，亮灯：对角 + 底行 -->
  <rect x="470" y="150" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="520" y="150" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="570" y="150" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="620" y="150" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="670" y="150" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>

  <rect x="470" y="200" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="520" y="200" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="570" y="200" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="620" y="200" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="670" y="200" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>

  <rect x="470" y="250" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="520" y="250" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="570" y="250" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="620" y="250" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="670" y="250" width="40" height="40" rx="6" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1.5"/>

  <rect x="470" y="300" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="520" y="300" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="570" y="300" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="620" y="300" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>
  <rect x="670" y="300" width="40" height="40" rx="6" fill="#4A6CF7" stroke="#4A6CF7" stroke-width="1.5"/>

  <text x="600" y="380" text-anchor="middle" font-size="13" fill="#64748b">→ 灯光矩阵：每行一次外循环</text>
  <text x="600" y="400" text-anchor="middle" font-size="13" fill="#64748b">每列一次内循环</text>

  <rect x="0" y="440" width="800" height="20" fill="#1e293b"/>
  <text x="400" y="454" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Courier New, monospace">for i in range(行): for j in range(列): 点亮(i, j)</text>
</svg>
