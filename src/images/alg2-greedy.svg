<svg width="800" height="430" viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="430" fill="#f8f9fc"/>

  <!-- 标题 -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">贪心选择：每步都拿「当下最好」的那个</text>

  <defs>
    <marker id="grArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- 可用硬币 -->
  <text x="400" y="64" text-anchor="middle" font-size="14" fill="#64748b">钱包里有这些面额（从大到小）：25 / 10 / 5 / 1 分</text>

  <!-- 瀑布：剩余金额 -->
  <text x="400" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A6CF7">目标 67 分 → 每步取「≤ 剩余的最大硬币」</text>

  <!-- 6 个选择箭头标注 -->
  <text x="75" y="150" text-anchor="middle" font-size="13" fill="#10b981">取 25</text>
  <text x="185" y="150" text-anchor="middle" font-size="13" fill="#10b981">取 25</text>
  <text x="295" y="150" text-anchor="middle" font-size="13" fill="#10b981">取 10</text>
  <text x="405" y="150" text-anchor="middle" font-size="13" fill="#10b981">取 5</text>
  <text x="515" y="150" text-anchor="middle" font-size="13" fill="#10b981">取 1</text>
  <text x="625" y="150" text-anchor="middle" font-size="13" fill="#10b981">取 1</text>

  <!-- 剩余金额盒子（7 个） -->
  <rect x="20" y="160" width="90" height="46" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="65" y="188" text-anchor="middle" font-size="15" fill="#1e293b">剩 67</text>
  <rect x="130" y="160" width="90" height="46" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="175" y="188" text-anchor="middle" font-size="15" fill="#1e293b">剩 42</text>
  <rect x="240" y="160" width="90" height="46" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="285" y="188" text-anchor="middle" font-size="15" fill="#1e293b">剩 17</text>
  <rect x="350" y="160" width="90" height="46" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="395" y="188" text-anchor="middle" font-size="15" fill="#1e293b">剩 7</text>
  <rect x="460" y="160" width="90" height="46" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="505" y="188" text-anchor="middle" font-size="15" fill="#1e293b">剩 2</text>
  <rect x="570" y="160" width="90" height="46" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="615" y="188" text-anchor="middle" font-size="15" fill="#1e293b">剩 1</text>
  <rect x="680" y="160" width="90" height="46" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="3"/>
  <text x="725" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">剩 0</text>

  <!-- 箭头 -->
  <line x1="110" y1="183" x2="128" y2="183" stroke="#10b981" stroke-width="2" marker-end="url(#grArrow)"/>
  <line x1="220" y1="183" x2="238" y2="183" stroke="#10b981" stroke-width="2" marker-end="url(#grArrow)"/>
  <line x1="330" y1="183" x2="348" y2="183" stroke="#10b981" stroke-width="2" marker-end="url(#grArrow)"/>
  <line x1="440" y1="183" x2="458" y2="183" stroke="#10b981" stroke-width="2" marker-end="url(#grArrow)"/>
  <line x1="550" y1="183" x2="568" y2="183" stroke="#10b981" stroke-width="2" marker-end="url(#grArrow)"/>
  <line x1="660" y1="183" x2="678" y2="183" stroke="#10b981" stroke-width="2" marker-end="url(#grArrow)"/>

  <!-- 硬币堆 -->
  <text x="400" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#10b981">最终凑出 67 分，只用了 6 枚硬币：</text>
  <circle cx="250" cy="290" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="296" text-anchor="middle" font-size="14" fill="#1e293b">25</text>
  <circle cx="320" cy="290" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="296" text-anchor="middle" font-size="14" fill="#1e293b">25</text>
  <circle cx="390" cy="290" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="390" y="296" text-anchor="middle" font-size="14" fill="#1e293b">10</text>
  <circle cx="460" cy="290" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="296" text-anchor="middle" font-size="14" fill="#1e293b">5</text>
  <circle cx="530" cy="290" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="530" y="296" text-anchor="middle" font-size="14" fill="#1e293b">1</text>
  <circle cx="600" cy="290" r="22" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="296" text-anchor="middle" font-size="14" fill="#1e293b">1</text>

  <!-- 对比栏 -->
  <rect x="0" y="350" width="800" height="80" rx="0" fill="#1e293b"/>
  <text x="400" y="382" text-anchor="middle" font-size="14" fill="#e2e8f0" font-family="Courier New, monospace">贪心：25+25+10+5+1+1 = 6 枚 ✅ 最少</text>
  <text x="400" y="410" text-anchor="middle" font-size="14" fill="#94a3b8" font-family="Courier New, monospace">若乱选（如全用 1 分）→ 要 67 枚。每步选当下最优，恰好全局最优。</text>
</svg>
