<svg xmlns="http://www.w3.org/2000/svg" width="680" height="648" viewBox="0 0 680 648" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svga-variable-assignment-flow-title svga-variable-assignment-flow-desc">
  <title id="svga-variable-assignment-flow-title">变量重新赋值的状态变化</title>
  <desc id="svga-variable-assignment-flow-desc">以 ticket_price 从 30 改为 35 为例，展示赋值把右侧值写入左侧变量，以及旧值被新值替换的过程。</desc>
  <rect x="0" y="0" width="680" height="648" fill="#F8FAFC"/>
  <text x="40" y="54" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1E293B">变量赋值：票价从 30 改成 35</text>
  <text x="40" y="82" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" fill="#475569">例子：每执行一行，右侧的值会写入左侧同名变量。</text>

  <rect x="40" y="112" width="600" height="126" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="74" cy="149" r="17" fill="#DBEAFE"/>
  <text x="74" y="155" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">1</text>
  <text x="108" y="155" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="20" font-weight="700" fill="#1E3A8A">ticket_price = 30</text>
  <text x="108" y="190" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" fill="#475569">先计算右边：得到整数 30。</text>
  <rect x="468" y="139" width="128" height="68" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="532" y="164" text-anchor="middle" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="15" font-weight="700" fill="#1E3A8A">int</text>
  <text x="532" y="193" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1E293B">30</text>

  <path d="M340 255 L340 282" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 275 L340 283 L348 275" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="362" y="274" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1E3A8A">写入名字对应的位置</text>

  <rect x="40" y="300" width="600" height="136" rx="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <circle cx="74" cy="337" r="17" fill="#DBEAFE"/>
  <text x="74" y="343" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">2</text>
  <text x="108" y="343" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" fill="#475569">当前变量状态</text>
  <rect x="184" y="365" width="312" height="48" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="212" y="396" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="18" font-weight="700" fill="#1E3A8A">ticket_price</text>
  <text x="462" y="397" text-anchor="end" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1E293B">30</text>

  <path d="M340 452 L340 479" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <path d="M332 472 L340 480 L348 472" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="40" y="496" width="600" height="118" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <circle cx="74" cy="533" r="17" fill="#DBEAFE"/>
  <text x="74" y="539" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">3</text>
  <text x="108" y="539" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="20" font-weight="700" fill="#1E3A8A">ticket_price = 35</text>
  <text x="108" y="574" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" fill="#475569">同名变量再次被赋值：旧的 30 被替换。</text>
  <rect x="468" y="519" width="128" height="68" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="532" y="548" text-anchor="middle" font-family="JetBrains Mono, PingFang SC, Noto Sans SC, Microsoft YaHei, monospace" font-size="15" font-weight="700" fill="#1E3A8A">现在保存</text>
  <text x="532" y="576" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1E293B">35</text>
</svg>