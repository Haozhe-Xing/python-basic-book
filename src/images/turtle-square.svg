<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="420" fill="#f8f9fc"/>

  <!-- 标题 -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">海龟画正方形：四步走</text>

  <!-- 画布区 -->
  <rect x="40" y="60" width="380" height="320" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 正方形四边 -->
  <!-- A(140,320) B(340,320) C(340,140) D(140,140) -->
  <line x1="140" y1="320" x2="340" y2="320" stroke="#4A6CF7" stroke-width="4"/>
  <line x1="340" y1="320" x2="340" y2="140" stroke="#4A6CF7" stroke-width="4"/>
  <line x1="340" y1="140" x2="140" y2="140" stroke="#4A6CF7" stroke-width="4"/>
  <line x1="140" y1="140" x2="140" y2="320" stroke="#4A6CF7" stroke-width="4"/>

  <!-- 起点海龟 -->
  <circle cx="140" cy="320" r="16" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <circle cx="134" cy="316" r="3" fill="#fff"/>
  <circle cx="146" cy="316" r="3" fill="#fff"/>
  <text x="140" y="360" text-anchor="middle" font-size="12" fill="#64748b">起点 A</text>

  <!-- 转角标记 -->
  <text x="352" y="332" font-size="18" fill="#f59e0b">⟳</text>
  <text x="352" y="132" font-size="18" fill="#f59e0b">⟳</text>
  <text x="128" y="132" font-size="18" fill="#f59e0b">⟳</text>
  <text x="128" y="332" font-size="18" fill="#f59e0b">⟳</text>

  <!-- 边标签 -->
  <text x="240" y="312" text-anchor="middle" font-size="14" fill="#1e293b">① 前100</text>
  <text x="352" y="235" text-anchor="middle" font-size="14" fill="#1e293b">② 前100</text>
  <text x="240" y="132" text-anchor="middle" font-size="14" fill="#1e293b">③ 前100</text>
  <text x="128" y="235" text-anchor="middle" font-size="14" fill="#1e293b">④ 前100</text>

  <!-- 代码区 -->
  <rect x="450" y="60" width="310" height="320" rx="10" fill="#0f172a"/>
  <text x="470" y="92" font-size="14" fill="#94a3b8" font-family="Courier New, monospace">import turtle</text>
  <text x="470" y="120" font-size="14" fill="#e2e8f0" font-family="Courier New, monospace">t = turtle.Turtle()</text>
  <text x="470" y="150" font-size="14" fill="#7dd3fc" font-family="Courier New, monospace">t.forward(100)  # ①</text>
  <text x="470" y="178" font-size="14" fill="#fcd34d" font-family="Courier New, monospace">t.right(90)</text>
  <text x="470" y="206" font-size="14" fill="#7dd3fc" font-family="Courier New, monospace">t.forward(100)  # ②</text>
  <text x="470" y="234" font-size="14" fill="#fcd34d" font-family="Courier New, monospace">t.right(90)</text>
  <text x="470" y="262" font-size="14" fill="#7dd3fc" font-family="Courier New, monospace">t.forward(100)  # ③</text>
  <text x="470" y="290" font-size="14" fill="#fcd34d" font-family="Courier New, monospace">t.right(90)</text>
  <text x="470" y="318" font-size="14" fill="#7dd3fc" font-family="Courier New, monospace">t.forward(100)  # ④</text>
  <text x="470" y="356" font-size="13" fill="#94a3b8" font-family="Courier New, monospace">turtle.done()  # 保持窗口</text>

  <!-- 底部说明 -->
  <rect x="0" y="400" width="800" height="20" fill="#1e293b"/>
  <text x="400" y="414" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Courier New, monospace">forward(100) 画一条边，right(90) 转个直角，重复 4 次 = 正方形</text>
</svg>
