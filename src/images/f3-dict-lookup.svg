<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A6CF7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#f8f9fc"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">字典查表：用"名字"直接查到"分数"</text>

  <!-- 查分请求 -->
  <rect x="60" y="60" width="240" height="44" rx="8" fill="#0f172a"/>
  <text x="180" y="88" text-anchor="middle" font-size="15" fill="#7dd3fc" font-family="Courier New, monospace">scores["小明"]</text>
  <line x1="180" y1="104" x2="180" y2="142" stroke="#4A6CF7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 字典标题 -->
  <text x="400" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">📖 scores 字典（key → value）</text>

  <!-- 第 1 行 -->
  <rect x="180" y="170" width="160" height="50" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="260" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">小明</text>
  <rect x="420" y="170" width="160" height="50" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="201" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">95</text>
  <line x1="340" y1="195" x2="418" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 第 2 行 -->
  <rect x="180" y="240" width="160" height="50" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="260" y="271" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">小红</text>
  <rect x="420" y="240" width="160" height="50" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="271" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">88</text>
  <line x1="340" y1="265" x2="418" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 第 3 行 -->
  <rect x="180" y="310" width="160" height="50" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="2"/>
  <text x="260" y="341" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">小刚</text>
  <rect x="420" y="310" width="160" height="50" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="341" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">76</text>
  <line x1="340" y1="335" x2="418" y2="335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部说明 -->
  <rect x="0" y="400" width="800" height="20" fill="#1e293b"/>
  <text x="400" y="414" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Courier New, monospace">key（名字） → value（分数），像查字典一步到位，不用从头数</text>
</svg>
