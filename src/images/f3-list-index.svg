<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svga-list-index-title svga-list-index-desc">
  <title id="svga-list-index-title">列表索引从零开始</title>
  <desc id="svga-list-index-desc">用名字列表演示正向索引零到三、负向索引负四到负一，以及 names[0] 如何取出小明。</desc>
  <defs>
    <marker id="svga-list-index-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="400" fill="#f8fafc"/>
  <text x="340" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">列表索引：从 0 开始数</text>
  <text x="340" y="64" text-anchor="middle" font-size="14" fill="#475569" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">同一个元素可以从左边数，也可以从右边数</text>

  <rect x="44" y="88" width="154" height="46" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="121" y="117" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a" font-family="SFMono-Regular, Consolas, monospace">names[0]</text>
  <line x1="121" y1="134" x2="121" y2="169" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#svga-list-index-arrow)"/>

  <text x="44" y="166" font-size="14" font-weight="600" fill="#334155" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">正向索引</text>
  <g font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">
    <rect x="44" y="180" width="138" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="196" y="180" width="138" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="348" y="180" width="138" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="500" y="180" width="138" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="113" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">索引 0</text>
    <text x="265" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">索引 1</text>
    <text x="417" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">索引 2</text>
    <text x="569" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">索引 3</text>
    <text x="113" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">小明</text>
    <text x="265" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">小红</text>
    <text x="417" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">小刚</text>
    <text x="569" y="237" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">小美</text>
  </g>

  <text x="44" y="285" font-size="14" font-weight="600" fill="#334155" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">从右边倒数</text>
  <g font-size="15" font-weight="700" fill="#047857" font-family="SFMono-Regular, Consolas, monospace">
    <text x="113" y="310" text-anchor="middle">-4</text>
    <text x="265" y="310" text-anchor="middle">-3</text>
    <text x="417" y="310" text-anchor="middle">-2</text>
    <text x="569" y="310" text-anchor="middle">-1</text>
  </g>

  <rect x="44" y="334" width="594" height="42" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="341" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif">第 1 个元素是 names[0]，最后 1 个元素是 names[-1]</text>
</svg>
