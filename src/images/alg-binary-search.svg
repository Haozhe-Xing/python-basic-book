<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="800" height="500" fill="#f8f9fc"/>

  <!-- 标题 -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">二分搜索：每次砍半，区间越来越小</text>
  <text x="400" y="56" text-anchor="middle" font-size="13" fill="#64748b">目标 = 23（数组已按从小到大排好）</text>

  <!-- 颜色图例 -->
  <rect x="500" y="64" width="270" height="24" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <polygon points="516,76 528,76 522,84" fill="#10b981"/><text x="536" y="83" font-size="12" fill="#1e293b">low 左边界</text>
  <polygon points="606,76 618,76 612,84" fill="#ef4444"/><text x="626" y="83" font-size="12" fill="#1e293b">high 右边界</text>
  <polygon points="700,76 712,76 706,84" fill="#4A6CF7"/><text x="720" y="83" font-size="12" fill="#1e293b">mid 中点</text>

  <!-- ===== 第1步 frame1: cells y=110 ===== -->
  <text x="120" y="100" font-size="14" font-weight="bold" fill="#4A6CF7">第 1 步</text>
  <!-- cells -->
  <g font-size="14" fill="#1e293b" text-anchor="middle" font-family="Arial">
    <rect x="120" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="144" y="138">2</text>
    <rect x="176" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="200" y="138">5</text>
    <rect x="232" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="256" y="138">8</text>
    <rect x="288" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="312" y="138">12</text>
    <rect x="344" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="368" y="138">17</text>
    <rect x="400" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="424" y="138">23</text>
    <rect x="456" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="480" y="138">28</text>
    <rect x="512" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="536" y="138">34</text>
    <rect x="568" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="592" y="138">41</text>
    <rect x="624" y="110" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="648" y="138">50</text>
  </g>
  <!-- pointers: low=0, high=9, mid=4 -->
  <polygon points="138,98 150,98 144,106" fill="#10b981"/><text x="144" y="92" font-size="12" fill="#10b981" text-anchor="middle">low</text>
  <polygon points="642,98 654,98 648,106" fill="#ef4444"/><text x="648" y="92" font-size="12" fill="#ef4444" text-anchor="middle">high</text>
  <polygon points="362,98 374,98 368,106" fill="#4A6CF7"/><text x="368" y="92" font-size="12" fill="#4A6CF7" text-anchor="middle">mid</text>
  <text x="400" y="178" text-anchor="middle" font-size="13" fill="#64748b">mid=17，23 &gt; 17 → 去右半边，low = mid+1 = 5</text>

  <!-- ===== 第2步 frame2: cells y=210 ===== -->
  <text x="120" y="208" font-size="14" font-weight="bold" fill="#4A6CF7">第 2 步</text>
  <g font-size="14" fill="#1e293b" text-anchor="middle" font-family="Arial">
    <rect x="120" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="144" y="246">2</text>
    <rect x="176" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="200" y="246">5</text>
    <rect x="232" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="256" y="246">8</text>
    <rect x="288" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="312" y="246">12</text>
    <rect x="344" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="368" y="246">17</text>
    <rect x="400" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="424" y="246">23</text>
    <rect x="456" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="480" y="246">28</text>
    <rect x="512" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="536" y="246">34</text>
    <rect x="568" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="592" y="246">41</text>
    <rect x="624" y="218" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="648" y="246">50</text>
  </g>
  <!-- pointers: low=5, high=9, mid=7 -->
  <polygon points="418,206 430,206 424,214" fill="#10b981"/><text x="424" y="200" font-size="12" fill="#10b981" text-anchor="middle">low</text>
  <polygon points="642,206 654,206 648,214" fill="#ef4444"/><text x="648" y="200" font-size="12" fill="#ef4444" text-anchor="middle">high</text>
  <polygon points="530,206 542,206 536,214" fill="#4A6CF7"/><text x="536" y="200" font-size="12" fill="#4A6CF7" text-anchor="middle">mid</text>
  <text x="400" y="286" text-anchor="middle" font-size="13" fill="#64748b">mid=34，23 &lt; 34 → 去左半边，high = mid-1 = 6</text>

  <!-- ===== 第3步 frame3: cells y=330 ===== -->
  <text x="120" y="328" font-size="14" font-weight="bold" fill="#10b981">第 3 步（命中）</text>
  <g font-size="14" fill="#1e293b" text-anchor="middle" font-family="Arial">
    <rect x="120" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="144" y="366">2</text>
    <rect x="176" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="200" y="366">5</text>
    <rect x="232" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="256" y="366">8</text>
    <rect x="288" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="312" y="366">12</text>
    <rect x="344" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="368" y="366">17</text>
    <rect x="400" y="338" width="48" height="44" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="3"/><text x="424" y="366" font-weight="bold" fill="#10b981">23</text>
    <rect x="456" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="480" y="366">28</text>
    <rect x="512" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="536" y="366">34</text>
    <rect x="568" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="592" y="366">41</text>
    <rect x="624" y="338" width="48" height="44" rx="8" fill="#e8ecff" stroke="#4A6CF7" stroke-width="1"/><text x="648" y="366">50</text>
  </g>
  <!-- pointers: low=5, high=6, mid=5(命中) -->
  <polygon points="418,326 430,326 424,334" fill="#10b981"/><text x="424" y="320" font-size="12" fill="#10b981" text-anchor="middle">low</text>
  <polygon points="474,326 486,326 480,334" fill="#ef4444"/><text x="480" y="320" font-size="12" fill="#ef4444" text-anchor="middle">high</text>
  <polygon points="414,300 426,300 420,308" fill="#4A6CF7"/><text x="420" y="294" font-size="12" fill="#4A6CF7" text-anchor="middle">mid</text>
  <text x="420" y="404" text-anchor="middle" font-size="13" fill="#10b981" font-weight="bold">mid=23，命中！返回位置 5 ✅</text>

  <!-- 底部说明 -->
  <rect x="0" y="470" width="800" height="30" fill="#1e293b"/>
  <text x="400" y="490" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Courier New, monospace">3 步就从 10 个元素里找到目标；100 万个元素也只要约 20 步 —— 这就是 O(log n)</text>
</svg>
